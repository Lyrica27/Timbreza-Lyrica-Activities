<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="./css/style2.css">
<style>
    body { padding: 20px; }
    .dark-mode { background: #1c1c1c; color: #f1f1f1; }
    .table-dark th, .table-dark td { color: #f1f1f1; }
</style>
</head>
<body>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Student Dashboard</h2>
        <div>
            <button class="btn btn-secondary me-2" id="toggleTheme">Dark Mode</button>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-md-4">
            <input type="text" id="searchInput" class="form-control" placeholder="Search by Name / ID / Email">
        </div>
        <div class="col-md-3">
            <select id="courseFilter" class="form-select">
                <option value="">All Courses</option>
            </select>
        </div>
        <div class="col-md-2">
            <button class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#addModal">Add Student</button>
        </div>
    </div>

    <table class="table table-striped table-hover" id="studentTable">
        <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Student ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Course</th>
                <th>Year</th>
                <th>Enroll Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="students"></tbody>
    </table>

    <nav>
        <ul class="pagination" id="pagination"></ul>
    </nav>
</div>

<!-- Add/Edit Modal -->
<div class="modal fade" id="addModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add / Edit Student</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editId">
        <div class="mb-2">
            <input type="text" id="student_id" class="form-control" placeholder="Student ID">
        </div>
        <div class="mb-2">
            <input type="text" id="first_name" class="form-control" placeholder="First Name">
        </div>
        <div class="mb-2">
            <input type="text" id="last_name" class="form-control" placeholder="Last Name">
        </div>
        <div class="mb-2">
            <input type="email" id="email" class="form-control" placeholder="Email">
        </div>
        <div class="mb-2">
            <input type="text" id="course" class="form-control" placeholder="Course">
        </div>
        <div class="mb-2">
            <input type="number" id="year_level" class="form-control" placeholder="Year Level">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-success" onclick="saveStudent()">Save</button>
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
if (!sessionStorage.getItem("auth")) window.location.href = "login.html";

const API = "http://localhost/api";
let students = [], filtered = [], currentPage = 1, perPage = 5;

const searchInput = document.getElementById("searchInput");
const courseFilter = document.getElementById("courseFilter");

// -------------------- Load Students --------------------
async function loadStudents() {
    try {
        const res = await fetch(`${API}/student-list.php`);
        const data = await res.json();
        if (!data.success) throw new Error("Failed to load students");

        students = data.students;
        populateCourseFilter();
        applyFilters();
    } catch (e) {
        alert(e.message);
    }
}

// -------------------- Populate Course Filter --------------------
function populateCourseFilter() {
    const courses = [...new Set(students.map(s => s.course).filter(c => c))];
    courseFilter.innerHTML = '<option value="">All Courses</option>';
    courses.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        courseFilter.appendChild(opt);
    });
}

// -------------------- Apply Search & Filter --------------------
function applyFilters() {
    const query = searchInput.value.toLowerCase();
    const course = courseFilter.value;

    filtered = students.filter(s => {
        const match = (s.first_name + s.last_name + s.student_id + s.email).toLowerCase().includes(query);
        return match && (!course || s.course === course);
    });

    currentPage = 1;
    renderTable();
    renderPagination();
}

// -------------------- Render Table --------------------
function renderTable() {
    const tbody = document.getElementById("students");
    tbody.innerHTML = "";
    const start = (currentPage - 1) * perPage;
    const pageData = filtered.slice(start, start + perPage);

    pageData.forEach(s => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${s.id}</td>
            <td>${s.student_id}</td>
            <td>${s.first_name}</td>
            <td>${s.last_name}</td>
            <td>${s.email}</td>
            <td>${s.course}</td>
            <td>${s.year_level}</td>
            <td>${s.enrollment_date}</td>
            <td>
                <button class="btn btn-sm btn-primary me-1" onclick="editStudent(${s.id})">Edit</button>
                <button class="btn btn-sm btn-danger" onclick="deleteStudent(${s.id})">Delete</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

// -------------------- Pagination --------------------
function renderPagination() {
    const pages = Math.ceil(filtered.length / perPage);
    const ul = document.getElementById("pagination");
    ul.innerHTML = "";
    for (let i = 1; i <= pages; i++) {
        const li = document.createElement('li');
        li.className = `page-item ${i === currentPage ? 'active' : ''}`;
        li.innerHTML = `<a class="page-link" href="#">${i}</a>`;
        li.onclick = () => { currentPage = i; renderTable(); renderPagination(); };
        ul.appendChild(li);
    }
}

// -------------------- Save/Add/Edit Student --------------------
async function saveStudent() {
    const id = document.getElementById("editId").value;
    const student = {
        student_id: document.getElementById("student_id").value.trim(),
        first_name: document.getElementById("first_name").value.trim(),
        last_name: document.getElementById("last_name").value.trim(),
        email: document.getElementById("email").value.trim(),
        course: document.getElementById("course").value.trim(),
        year_level: parseInt(document.getElementById("year_level").value) || 1
    };

    if (!student.student_id || !student.first_name || !student.last_name || !student.email) {
        alert("Required fields missing"); 
        return;
    }

    try {
        let url = `${API}/student-add.php`, method = 'POST';
        if (id) {
            url = `${API}/edit-student.php`;
            student.id = parseInt(id);
            method = 'POST';
        }

        const res = await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(student)
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.message || "Error");

        alert(data.message);
        const modal = bootstrap.Modal.getInstance(document.getElementById('addModal'));
        modal.hide();
        loadStudents();
    } catch (e) {
        alert(e.message);
    }
}

// -------------------- Edit Student --------------------
function editStudent(id) {
    const s = students.find(s => s.id === id);
    if (!s) return alert("Student not found");

    document.getElementById("editId").value = s.id;
    document.getElementById("student_id").value = s.student_id;
    document.getElementById("first_name").value = s.first_name;
    document.getElementById("last_name").value = s.last_name;
    document.getElementById("email").value = s.email;
    document.getElementById("course").value = s.course;
    document.getElementById("year_level").value = s.year_level;

    new bootstrap.Modal(document.getElementById('addModal')).show();
}

// -------------------- Delete Student --------------------
async function deleteStudent(id) {
    if (!confirm("Are you sure you want to delete?")) return;

    try {
        const res = await fetch(`${API}/student-delete.php`, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.message || "Delete failed");

        alert(data.message);
        loadStudents();
    } catch (e) {
        alert(e.message);
    }
}

// -------------------- Event Listeners --------------------
searchInput.addEventListener('input', applyFilters);
courseFilter.addEventListener('change', applyFilters);

document.getElementById("toggleTheme").onclick = () => {
    document.body.classList.toggle("dark-mode");
    document.querySelector('table').classList.toggle('table-dark');
};

// -------------------- Logout --------------------
function logout() { 
    sessionStorage.removeItem("auth"); 
    window.location.href = "login.html";
}

// -------------------- Initial Load --------------------
loadStudents();
</script>
</body>
</html>
