<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Employee Info System</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-wrapper">
        <div class="login-card text-center">

            <div class="login-icon">&#x1F464;</div>

            <h3>Welcome Back</h3>
            <p class="subtitle">Sign in to Employee Info System</p>

            <form action="dashboard.html">

                <div class="mb-3 text-start">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" placeholder="Enter your username">
                </div>

                <div class="mb-4 text-start">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="Enter your password">
                </div>

                <button type="submit" class="btn btn-login w-100">Sign In</button>

            </form>

            <p class="mt-4 mb-0" style="font-size: 12px; color: #94a3b8;">&copy; 2026 Employee Info System</p>

        </div>
    </div>

    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
</body>

</html>
